<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin — Dashboard</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 6%;display:flex;justify-content:space-between;align-items:center;gap:18px;position:sticky;top:0;z-index:5}.brand{font-weight:950;color:var(--g);letter-spacing:2px;font-size:24px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--g);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;font-size:13px}.secondary{background:#e7f2ec;color:var(--g)}main{max-width:1200px;margin:auto;padding:34px 6%}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.head h1{margin:4px 0;font-size:34px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.label{font-size:13px;color:var(--muted)}.value{font-size:29px;font-weight:900;margin-top:7px}.trend{font-size:12px;color:var(--g);margin-top:5px}.section{margin-top:28px}.section h2{font-size:20px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:14px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:12px;color:var(--muted);background:#f8fbf9}.status{display:inline-block;border-radius:99px;padding:5px 9px;background:#e7f2ec;color:var(--g);font-weight:800;text-transform:capitalize}.status.failed,.status.cancelled{background:#fdecec;color:#a33}.error{padding:16px;background:#fff3f3;color:#a33;border-radius:14px;margin-top:15px}.loading{color:var(--muted);padding:25px}.bar{height:9px;background:#e5ece8;border-radius:99px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:var(--g)}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rank{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.mini-grid{grid-template-columns:1fr}.nav{width:100%}}@media(max-width:520px){.grid{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}main{padding-top:25px}header{align-items:flex-start;flex-direction:column}.nav{justify-content:flex-start}}</style><script src="admin-auth.js"></script></head><body><header><div><div class="brand">CREDENCE ADMIN</div><div class="sub">Operations & analytics</div></div><nav class="nav" aria-label="Admin modules"><a class="btn secondary" href="admin-dashboard.html">Dashboard</a><a class="btn secondary" href="admin-courses.html">Courses</a><a class="btn secondary" href="admin-students.html">Students</a><a class="btn secondary" href="admin-quizzes.html">Quizzes</a><a class="btn secondary" href="admin-certificates.html">Certificates</a><a class="btn secondary" href="admin-communications.html">Communications</a><a class="btn secondary" href="admin-support.html">Support</a><a class="btn secondary" href="admin-settings.html">Settings</a><button id="refresh" class="btn">Refresh</button></nav></header><main><div class="head"><div><div class="muted">OVERVIEW</div><h1>Dashboard</h1><div id="updated" class="muted">Loading live data…</div></div></div><div id="stats" class="grid"><div class="card loading">Loading…</div></div><div class="section"><h2>Recent orders</h2><div id="orders" class="table-wrap"><div class="loading">Loading orders…</div></div></div><div class="section mini-grid"><div class="card"><h2>Top courses</h2><div id="courses" class="loading">Loading…</div></div><div class="card"><h2>Learning completion</h2><div id="completion" class="loading">Loading…</div></div></div><div id="error"></div></main><script src="admin-dashboard.js"></script></body></html>

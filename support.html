<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Support</title><style>body{font-family:system-ui;margin:0;background:#f5f8f6;color:#123126}header{background:#fff;padding:16px 6%;border-bottom:1px solid #e2ebe6;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;color:#08783f;letter-spacing:2px}.wrap{max-width:900px;margin:auto;padding:30px 6%}.card{background:#fff;border:1px solid #e2ebe6;border-radius:18px;padding:20px;margin:16px 0}.field{display:grid;gap:6px;margin:12px 0}input,select,textarea{padding:12px;border:1px solid #d5e1db;border-radius:10px;font:inherit}button{border:0;background:#08783f;color:#fff;padding:11px 15px;border-radius:11px;font-weight:700}.msg{padding:10px;background:#f3f7f4;border-radius:10px;margin:7px 0}.muted{color:#66756e}.row{display:flex;justify-content:space-between;gap:12px}.status{font-size:12px;background:#e7f2ec;color:#08783f;border-radius:99px;padding:5px 9px;font-weight:800}@media(max-width:650px){.row{flex-direction:column}}</style></head><body><header><div class="brand">CREDENCE</div><a href="index.html">← Back</a></header><main class="wrap"><h1>Help & Support</h1><p class="muted">Tell us what went wrong. Your support conversation stays linked to your CREDENCE account.</p><section class="card"><h2>New support ticket</h2><div class="field"><label>Subject</label><input id="subject" maxlength="160" placeholder="What do you need help with?"></div><div class="field"><label>Category</label><select id="category"><option value="general">General</option><option value="payment">Payment</option><option value="course">Course</option><option value="technical">Technical</option><option value="certificate">Certificate</option><option value="account">Account</option></select></div><div class="field"><label>Message</label><textarea id="message" rows="5" maxlength="5000" placeholder="Describe the issue..."></textarea></div><button id="create">Create ticket</button><p id="notice" class="muted"></p></section><section><h2>My tickets</h2><div id="tickets"><div class="card muted">Loading...</div></div></section></main><script src="support.js"></script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin — Media</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 5%;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-weight:950;color:var(--g);letter-spacing:2px;font-size:23px}.nav{display:flex;gap:7px;flex-wrap:wrap}.btn,button{border:0;border-radius:11px;padding:10px 14px;background:var(--g);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;font-size:13px}.secondary{background:#e7f2ec;color:var(--g)}main{max-width:1150px;margin:auto;padding:28px 5%}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{background:#fff;color:var(--ink);border:1px solid var(--line)}.tab.active{background:var(--g);color:#fff}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{padding:12px;border:1px solid #d5e1db;border-radius:10px;font:inherit;width:100%}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#e7f2ec;color:var(--g);font-size:12px;font-weight:850}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.danger{background:#fdecec;color:#9b3025}.empty{padding:25px;background:#fff;border-radius:18px;color:var(--muted)}@media(max-width:800px){.grid,.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}</style><script src="admin-auth.js"></script></head><body><header><div class="brand">CREDENCE ADMIN</div><nav class="nav"><a class="btn secondary" href="admin-dashboard.html">Dashboard</a><a class="btn secondary" href="admin-courses.html">Courses</a><a class="btn secondary" href="admin-quizzes.html">Quizzes</a><a class="btn secondary" href="admin-certificates.html">Certificates</a><a class="btn secondary" href="admin-communications.html">Communications</a></nav></header><main><h1>Media Publishing</h1><p class="muted">Publish videos, live classes, photos and homepage banners without changing the student home layout.</p><div class="tabs"><button class="tab active" data-mode="video">Videos</button><button class="tab" data-mode="live">Live</button><button class="tab" data-mode="photo">Photos</button><button class="tab" data-mode="banner">Banners</button></div><div id="app"></div></main><script>const U='https://tasoycsbzceohgjxizdp.supabase.co',K='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',$=id=>document.getElementById(id);let mode='video',rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function s(){try{return JSON.parse(localStorage.getItem('credence_session')||'null')}catch{return null}}async function api(p,o={}){const x=s();if(!x?.access_token)throw Error('Admin login required.');const r=await fetch(U+'/rest/v1/'+p,{...o,headers:{apikey:K,Authorization:'Bearer '+x.access_token,'Content-Type':'application/json',...(o.headers||{})}});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||d?.details||'Request failed');return d}function form(){const f=mode==='video'?`<div class="fields"><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Video URL</label><input id="url" type="url" placeholder="Direct MP4/HLS or supported video URL"></div><div class="field full"><label>Description</label><textarea id="desc"></textarea></div><div class="field"><label>Course ID (optional for free video)</label><input id="course"></div><div class="field"><label>Price (INR)</label><input id="price" type="number" min="0" value="0"></div></div>`:mode==='photo'?`<div class="fields"><div class="field"><label>Photo title</label><input id="title"></div><div class="field"><label>Image URL</label><input id="url" type="url"></div><div class="field full"><label>Description</label><textarea id="desc"></textarea></div></div>`:mode==='live'?`<div class="fields"><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Playback / live URL</label><input id="url" type="url"></div><div class="field full"><label>Description</label><textarea id="desc"></textarea></div><div class="field"><label>Course ID (optional)</label><input id="course"></div><div class="field"><label>Scheduled time</label><input id="scheduled" type="datetime-local"></div><div class="field"><label>Price (INR)</label><input id="price" type="number" min="0" value="0"></div><div class="field"><label><input id="islive" type="checkbox"> Live now</label></div></div>`:`<div class="fields"><div class="field"><label>Banner title</label><input id="title"></div><div class="field"><label>Image URL</label><input id="url" type="url"></div><div class="field full"><label>Subtitle</label><textarea id="desc"></textarea></div><div class="field"><label>Button text</label><input id="actionText" placeholder="Explore"></div><div class="field"><label>Button URL</label><input id="actionUrl" placeholder="student-courses.html"></div><div class="field"><label>Sort order</label><input id="sort" type="number" value="0"></div></div>`;return `<div class="panel"><h2>Publish ${mode}</h2>${f}<div class="actions"><button id="save">Publish</button><button id="refresh" class="secondary">Refresh</button></div></div><div id="list" class="grid"></div>`}async function load(){try{if(mode==='banner')rows=await api('banners?select=id,title,subtitle,image_path,action_text,action_url,active,sort_order,created_at&order=sort_order.asc,created_at.desc');else if(mode==='live')rows=await api('live_streams?select=id,title,description,playback_url,scheduled_at,is_live,price_inr,tier&order=scheduled_at.desc,created_at.desc');else rows=await api('content_items?select=id,kind,title,description,video_url,file_path,price_inr,published,tier,created_at&kind=eq.'+(mode==='photo'?'note':'video')+'&order=created_at.desc');render()}catch(e){$('app').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}function render(){$('app').innerHTML=form();$('save').onclick=save;$('refresh').onclick=load;const l=$('list');l.innerHTML=rows.length?rows.map(r=>`<article class="card"><span class="pill">${mode==='banner'?(r.active?'ACTIVE':'OFF'):mode==='live'?(r.is_live?'LIVE':'SCHEDULED'):(r.published?'PUBLISHED':'DRAFT')}</span><h3>${esc(r.title)}</h3><p class="muted">${esc(r.description||r.subtitle||'')}</p>${r.image_path||r.video_url||r.playback_url?`<small>${esc(r.image_path||r.video_url||r.playback_url)}</small>`:''}<div class="actions"><button class="danger" data-delete="${r.id}">Delete</button></div></article>`).join(''):'<div class="empty">Nothing published yet.</div>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}async function save(){try{const title=$('title').value.trim();if(!title)throw Error('Title is required');if(mode==='video'||mode==='photo'){const price=mode==='video'?Number($('price').value||0):0;const body={kind:mode==='video'?'video':'note',title,description:$('desc').value.trim()||null,video_url:$('url').value.trim()||null,course_id:mode==='video'&&$('course').value.trim()?$('course').value.trim():null,price_inr:price,tier:price>0?'paid':'free',published:true};await api('content_items',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)})}else if(mode==='live'){const price=Number($('price').value||0);await api('live_streams',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({title,description:$('desc').value.trim()||null,playback_url:$('url').value.trim()||null,course_id:$('course').value.trim()||null,scheduled_at:$('scheduled').value?new Date($('scheduled').value).toISOString():null,price_inr:price,tier:price>0?'paid':'free',is_live:$('islive').checked,created_by:s().user.id})})}else{await api('banners',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({title,subtitle:$('desc').value.trim()||null,image_path:$('url').value.trim()||null,action_text:$('actionText').value.trim()||null,action_url:$('actionUrl').value.trim()||null,active:true,sort_order:Number($('sort').value||0),created_by:s().user.id})})}await load()}catch(e){alert(e.message)}}async function remove(id){if(!confirm('Delete this item?'))return;try{const table=mode==='banner'?'banners':mode==='live'?'live_streams':'content_items';await api(table+'?id=eq.'+encodeURIComponent(id),{method:'DELETE'});await load()}catch(e){alert(e.message)}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});load();</script></body></html>

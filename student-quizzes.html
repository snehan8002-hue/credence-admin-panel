<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE — Quizzes</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:var(--g);letter-spacing:2px;font-size:23px}.btn,button{border:0;border-radius:11px;padding:10px 14px;background:var(--g);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#e7f2ec;color:var(--g)}main{max-width:1000px;margin:auto;padding:30px 5%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.muted{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}.option{display:block;width:100%;text-align:left;background:#f5f8f6;color:var(--ink);margin:8px 0;border:1px solid var(--line)}.option.selected{background:#e1f3e9;border-color:#08783f}.empty{padding:30px;background:#fff;border-radius:18px;color:var(--muted);grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">CREDENCE</div><div><a class="btn secondary" href="index.html">Home</a> <a class="btn secondary" href="student-tests.html">Tests</a></div></header><main><div id="app"><div class="empty">Loading quizzes…</div></div></main><script>const U='https://tasoycsbzceohgjxizdp.supabase.co',K='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',$=id=>document.getElementById(id);let quizzes=[],courses=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tok(){try{return JSON.parse(localStorage.getItem('credence_session')||'null')?.access_token||''}catch{return ''}}async function api(p,o={}){const r=await fetch(U+'/rest/v1/'+p,{...o,headers:{apikey:K,Authorization:'Bearer '+(tok()||K),'Content-Type':'application/json',...(o.headers||{})}});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'Request failed');return d}async function load(){quizzes=await api('quizzes?select=id,course_id,title,description,duration_seconds,max_attempts,published&published=eq.true&order=created_at.desc');courses=await api('courses?select=id,title');renderList()}function renderList(){$('app').innerHTML=`<h1>Quizzes</h1><p class="muted">Practice and track your scores. Paid-course quizzes are available after enrollment.</p><div class="grid">${quizzes.length?quizzes.map(q=>`<article class="card"><h3>${esc(q.title)}</h3><p class="muted">${esc(q.description||'')}</p><p>${Math.ceil(q.duration_seconds/60)} min · ${q.max_attempts} attempts</p><button data-start="${q.id}">Start quiz</button></article>`).join(''):'<div class="empty">No published quizzes available.</div>'}</div>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start))}async function start(id){$('app').innerHTML='<div class="panel">Loading quiz…</div>';try{const q=quizzes.find(x=>x.id===id);const qs=await api('quiz_questions?quiz_id=eq.'+id+'&select=id,question,explanation,marks,negative_marks,sort_order&order=sort_order.asc');const os=qs.length?await api('quiz_options?question_id=in.('+qs.map(x=>x.id).join(',')+')&select=id,question_id,option_text,sort_order&order=sort_order.asc'):[];const session=await api('rpc/start_quiz_attempt',{method:'POST',body:JSON.stringify({p_quiz_id:id})});const sid=session?.[0]?.session_id;if(!sid)throw Error('Could not start quiz. Please log in and make sure you have access.');$('app').innerHTML=`<div class="panel"><button id="back" class="secondary">← Quizzes</button><h1>${esc(q.title)}</h1><p class="muted">Select one answer per question, then submit.</p><div id="questions"></div><button id="submit">Submit quiz</button></div>`;qs.forEach((x,i)=>{const box=document.createElement('div');box.className='card';box.style.margin='14px 0';box.innerHTML=`<b>${i+1}. ${esc(x.question)}</b><div>${os.filter(o=>o.question_id===x.id).map(o=>`<button type="button" class="option" data-q="${x.id}" data-o="${o.id}">${esc(o.option_text)}</button>`).join('')}</div>`;$('questions').appendChild(box)});const answers={};document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{document.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');answers[b.dataset.q]=b.dataset.o});$('back').onclick=renderList;$('submit').onclick=async()=>{try{const payload=qs.map(x=>({question_id:x.id,option_id:answers[x.id]||null}));const result=await api('rpc/submit_quiz_attempt_atomic',{method:'POST',body:JSON.stringify({p_quiz_id:id,p_session_id:sid,p_answers:payload})});const r=Array.isArray(result)?result[0]:result;$('app').innerHTML=`<div class="panel"><h1>Quiz submitted 🎉</h1><p>Score: <b>${esc(r?.score??0)}</b></p><p>${esc(r?.correct_count??0)} correct · ${esc(r?.wrong_count??0)} wrong · ${esc(r?.unanswered_count??0)} unanswered</p><button id="again">Back to quizzes</button></div>`;$('again').onclick=renderList}catch(e){alert(e.message)}}}catch(e){$('app').innerHTML=`<div class="panel"><b>${esc(e.message)}</b><p class="muted">Log in first and make sure you are enrolled in the course or the quiz is attached to a free preview.</p><button onclick="location.reload()">Try again</button></div>`}}load().catch(e=>$('app').innerHTML='<div class="panel"><b>'+esc(e.message)+'</b></div>');</script></body></html>

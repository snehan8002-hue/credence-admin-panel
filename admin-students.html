<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin — Students & Orders</title><style>:root{--g:#08783f;--bg:#f5f8f6;--line:#dfe9e3;--muted:#66756e}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#123126}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 6%;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:23px;font-weight:950;color:var(--g);letter-spacing:2px}.muted{color:var(--muted)}main{max-width:1250px;margin:auto;padding:30px 6%}.tabs{display:flex;gap:8px;margin:20px 0}.tab,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.tab{background:#e7f2ec;color:var(--g)}.tab.active,.btn{background:var(--g);color:white}.search{padding:11px;border:1px solid var(--line);border-radius:10px;width:280px}.table{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:14px}.pill{padding:4px 8px;border-radius:99px;background:#e7f2ec;color:var(--g);font-size:12px;font-weight:800}.danger{background:#ffe9e9;color:#a22}.error{background:#fff0f0;color:#a22;padding:12px;border-radius:10px;margin:10px 0}.modal{position:fixed;inset:0;background:#12312666;display:grid;place-items:center;padding:18px;z-index:20}.modal[hidden]{display:none}.modal-card{width:min(100%,520px);background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 60px #12312633}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.close{background:#e7f2ec;color:var(--g);border:0;border-radius:10px;padding:8px 11px;font-weight:900}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:800}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions button{flex:1}.notice{padding:11px;border-radius:10px;background:#f1f6f3;margin:10px 0;font-size:13px}.success{background:#e7f5ed;color:#17623d}.fail{background:#fff0f0;color:#a22}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.search{width:100%}main{padding:22px 4%}.modal-card{padding:20px}.modal-actions{flex-direction:column}}</style></head><body><header><div><div class="brand">CREDENCE ADMIN</div><div class="muted">Students & Orders</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="newRegistration" class="btn">New registration</button><button id="refresh" class="tab">Refresh</button></div></header><main><div class="tabs"><button id="studentsTab" class="tab active">Students</button><button id="ordersTab" class="tab">Orders</button></div><input id="search" class="search" placeholder="Search…"><div id="out" style="margin-top:15px">Loading…</div></main><div id="regModal" class="modal" hidden><section class="modal-card"><div class="modal-head"><div><h2 style="margin:0">New registration</h2><p class="muted" style="margin:5px 0 0">Create a CREDENCE account without OTP.</p></div><button id="closeRegistration" class="close" type="button">✕</button></div><div id="regNotice" class="notice" hidden></div><form id="registrationForm"><div class="field"><label for="regName">Full name</label><input id="regName" required maxlength="120" placeholder="Full name"></div><div class="field"><label for="regEmail">Email</label><input id="regEmail" type="email" required autocomplete="email" placeholder="Email address"></div><div class="field"><label for="regPhone">Phone (optional)</label><input id="regPhone" type="tel" autocomplete="tel" placeholder="Phone number"></div><div class="field"><label for="regPassword">Password</label><input id="regPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"></div><div class="field"><label for="regRole">Account type</label><select id="regRole"><option value="student">Student</option><option value="admin">Admin</option><option value="master">Master</option></select></div><div class="modal-actions"><button id="createRegistration" class="btn" type="submit">Create registration</button><button id="cancelRegistration" class="tab" type="button">Cancel</button></div></form></section></div><script src="admin-students.js"></script><script src="admin-registration.js?v=1"></script></body></html>

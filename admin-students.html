<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin — Students & Orders</title><style>:root{--g:#08783f;--bg:#f5f8f6;--line:#dfe9e3;--muted:#66756e}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#123126}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 6%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:950;color:var(--g);letter-spacing:2px}main{max-width:1250px;margin:auto;padding:30px 6%}.tabs{display:flex;gap:8px;margin:20px 0}.tab,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.tab{background:#e7f2ec;color:var(--g)}.tab.active,.btn{background:var(--g);color:white}.search{padding:11px;border:1px solid var(--line);border-radius:10px;width:280px}.table{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:14px}.muted{color:var(--muted)}.pill{padding:4px 8px;border-radius:99px;background:#e7f2ec;color:var(--g);font-size:12px;font-weight:800}.danger{background:#ffe9e9;color:#a22}.error{background:#fff0f0;color:#a22;padding:12px;border-radius:10px;margin:10px 0}@media(max-width:650px){.search{width:100%}main{padding:22px 4%}}</style></head><body><header><div><div class="brand">CREDENCE ADMIN</div><div class="muted">Students & Orders</div></div><button id="refresh" class="tab">Refresh</button></header><main><div class="tabs"><button id="studentsTab" class="tab active">Students</button><button id="ordersTab" class="tab">Orders</button></div><input id="search" class="search" placeholder="Search…"><div id="out" style="margin-top:15px">Loading…</div></main><script src="admin-students.js"></script></body></html>

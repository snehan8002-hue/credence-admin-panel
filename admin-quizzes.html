<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin — Quizzes</title><style>:root{--g:#08783f;--bg:#f5f8f6;--line:#dfe9e3;--muted:#66756e}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#123126}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 6%}.brand{font-size:23px;font-weight:950;color:var(--g);letter-spacing:2px}main{max-width:1200px;margin:auto;padding:28px 6%}.btn,.tab{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn,.active{background:var(--g);color:white}.tab{background:#e7f2ec;color:var(--g)}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:6px 0 10px;font:inherit}textarea{min-height:80px}.muted{color:var(--muted)}.pill{padding:4px 8px;border-radius:99px;background:#e7f2ec;color:var(--g);font-size:12px;font-weight:800}.danger{background:#ffe9e9;color:#a22}@media(max-width:650px){main{padding:20px 4%}}</style></head><body><header><div class="brand">CREDENCE ADMIN</div><div class="muted">Quiz Management</div></header><main><div id="app">Loading…</div></main><script src="admin-quizzes.js"></script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin — Communications</title><style>:root{--g:#08783f;--bg:#f5f8f6;--line:#dfe9e3;--muted:#66756e}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#123126}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 6%;display:flex;justify-content:space-between}.brand{font-size:23px;font-weight:950;color:var(--g);letter-spacing:2px}main{max-width:1200px;margin:auto;padding:28px 6%}.tabs{display:flex;gap:8px;margin:18px 0}.tab,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.tab{background:#e7f2ec;color:var(--g)}.active,.btn{background:var(--g);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:15px 0}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:6px 0 12px;font:inherit}textarea{min-height:100px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:13px;padding:14px}.muted{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e7f2ec;color:var(--g);font-size:12px;font-weight:800}.danger{background:#ffe9e9;color:#a22;border:0;padding:8px;border-radius:8px}@media(max-width:650px){main{padding:20px 4%}}</style></head><body><header><div><div class="brand">CREDENCE ADMIN</div><div class="muted">Coupons · Announcements · Notifications</div></div></header><main><div class="tabs"><button id="couponTab" class="tab active">Coupons</button><button id="announceTab" class="tab">Announcements</button><button id="notifyTab" class="tab">Notifications</button></div><section id="app">Loading…</section></main><script src="admin-communications.js"></script></body></html>

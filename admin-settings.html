<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin — Settings</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:var(--g);letter-spacing:2px;font-size:24px}.wrap{max-width:850px;margin:auto;padding:30px 5%}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;font-weight:750}.field input{padding:13px;border:1px solid #d5e1db;border-radius:11px;font:inherit}.btn,button{border:0;border-radius:11px;padding:11px 15px;background:var(--g);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#e7f2ec;color:var(--g)}.notice{padding:11px 13px;border-radius:11px;background:#fff3cd;color:#705b12;margin:12px 0}.success{background:#e1f3e9;color:var(--g)}.danger{background:#fdecec;color:#9b3025}.muted{color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">CREDENCE ADMIN</div><a class="btn secondary" href="admin-dashboard.html">Dashboard</a></header><main class="wrap"><h1>Platform Settings</h1><p class="muted">Manage public branding and payment display settings.</p><div id="notice" class="notice">Checking administrator access…</div><form id="form" class="card" hidden><div class="grid"><div class="field"><label>Logo URL</label><input id="logo" type="url"></div><div class="field"><label>Tagline</label><input id="tagline" maxlength="160"></div><div class="field"><label>Primary color</label><input id="primary" maxlength="30"></div><div class="field"><label>Secondary color</label><input id="secondary" maxlength="30"></div><div class="field"><label>Profile layout</label><input id="layout" maxlength="40"></div><div class="field"><label>App version</label><input id="version" maxlength="40"></div><div class="field"><label>UPI display ID</label><input id="upi" maxlength="120"></div><div class="field"><label>UPI display name</label><input id="upiName" maxlength="120"></div></div><button type="submit">Save settings</button></form></main><script>const U='https://tasoycsbzceohgjxizdp.supabase.co',K='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',F=U+'/functions/v1/credence-admin',$=id=>document.getElementById(id);function s(){try{return JSON.parse(localStorage.getItem('credence_session')||'null')}catch{return null}}async function api(path,opt={}){const x=s();if(!x?.access_token)throw Error('Please log in as an administrator.');const r=await fetch(U+'/rest/v1/'+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+x.access_token,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error('Settings request failed');return r.status===204?null:r.json()}async function load(){try{const x=s();if(!x?.user?.id)throw Error('Administrator login required.');const p=(await api('profiles?id=eq.'+encodeURIComponent(x.user.id)+'&select=role,active,banned&limit=1'))[0];if(!p||!['master','admin'].includes(p.role)||!p.active||p.banned)throw Error('Administrator access required.');const row=(await api('app_settings?id=eq.true&select=logo_url,tagline,primary_color,secondary_color,profile_layout,app_version,upi_id,upi_name&limit=1'))[0]||{};$('logo').value=row.logo_url||'';$('tagline').value=row.tagline||'';$('primary').value=row.primary_color||'';$('secondary').value=row.secondary_color||'';$('layout').value=row.profile_layout||'';$('version').value=row.app_version||'';$('upi').value=row.upi_id||'';$('upiName').value=row.upi_name||'';$('form').hidden=false;$('notice').textContent='Settings loaded.';$('notice').className='notice success'}catch(e){$('notice').textContent=e.message}}$('form').onsubmit=async e=>{e.preventDefault();try{await api('app_settings?id=eq.true',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({logo_url:$('logo').value.trim()||null,tagline:$('tagline').value.trim()||null,primary_color:$('primary').value.trim()||null,secondary_color:$('secondary').value.trim()||null,profile_layout:$('layout').value.trim()||null,app_version:$('version').value.trim()||null,upi_id:$('upi').value.trim()||null,upi_name:$('upiName').value.trim()||null,updated_at:new Date().toISOString()})});$('notice').textContent='Platform settings saved.';$('notice').className='notice success'}catch(e){$('notice').textContent=e.message;$('notice').className='notice'}};load();</script></body></html>

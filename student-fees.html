<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE — Fees & Purchases</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:var(--g);letter-spacing:2px;font-size:23px}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--g);color:#fff;font-weight:800;text-decoration:none}.secondary{background:#e7f2ec;color:var(--g)}main{max-width:1050px;margin:auto;padding:30px 5%}.section{margin-top:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.amount{font-size:21px;font-weight:900;color:var(--g)}.status{display:inline-block;padding:5px 9px;border-radius:99px;background:#e7f2ec;color:var(--g);font-size:12px;font-weight:800}.muted{color:var(--muted)}.empty{padding:25px;background:#fff;border-radius:18px;color:var(--muted);grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">CREDENCE</div><a class="btn secondary" href="index.html">Back to learning</a></header><main><h1>Fees, Purchases & Certificates</h1><p class="muted">Everything you have paid for and earned in CREDENCE, in one place.</p><div class="section"><h2>Purchase history</h2><div id="orders" class="grid"><div class="empty">Loading…</div></div></div><div class="section"><h2>Paid / enrolled courses</h2><div id="enrollments" class="grid"><div class="empty">Loading…</div></div></div><div class="section"><h2>Certificates</h2><div id="certs" class="grid"><div class="empty">Loading…</div></div></div></main><script>const U='https://tasoycsbzceohgjxizdp.supabase.co',K='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',$=id=>document.getElementById(id);function s(){try{return JSON.parse(localStorage.getItem('credence_session')||'null')}catch{return null}}async function api(p){const x=s();if(!x?.access_token)throw Error('Please log in first.');const r=await fetch(U+'/rest/v1/'+p,{headers:{apikey:K,Authorization:'Bearer '+x.access_token}});const d=await r.json().catch(()=>[]);if(!r.ok)throw Error(d?.message||'Request failed');return d}const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const [orders,enrollments,certs]=await Promise.all([api('orders?select=id,course_id,amount_inr,status,payment_method,payment_reference,created_at&order=created_at.desc'),api('enrollments?select=id,course_id,active,created_at,courses(title,price_inr)&order=created_at.desc'),api('certificates?select=id,certificate_id,course_id,issue_date,revoked_at&order=issue_date.desc')]);$('orders').innerHTML=orders.length?orders.map(o=>`<article class="card"><span class="status">${esc(o.status||'unknown')}</span><h3>Course purchase</h3><div class="amount">₹${Number(o.amount_inr||0).toLocaleString('en-IN')}</div><p class="muted">${o.payment_method?esc(o.payment_method)+' · ':''}${new Date(o.created_at).toLocaleString('en-IN')}</p>${o.payment_reference?`<small class="muted">Ref: ${esc(o.payment_reference)}</small>`:''}</article>`).join(''):'<div class="empty">No purchases yet.</div>';$('enrollments').innerHTML=enrollments.length?enrollments.map(e=>`<article class="card"><h3>${esc(e.courses?.title||'Course')}</h3><div class="amount">₹${Number(e.courses?.price_inr||0).toLocaleString('en-IN')}</div><p class="muted">${e.active===false?'Inactive enrollment':'Active access'} · ${new Date(e.created_at).toLocaleDateString('en-IN')}</p><a class="btn" href="index.html#courses">Continue learning</a></article>`).join(''):'<div class="empty">No enrolled courses yet.</div>';$('certs').innerHTML=certs.length?certs.map(c=>`<article class="card"><h3>Certificate</h3><p class="muted">${esc(c.certificate_id||'Certificate')}</p><p>Issued: ${c.issue_date?new Date(c.issue_date).toLocaleDateString('en-IN'):'—'}</p><span class="status">${c.revoked_at?'Revoked':'Valid'}</span></article>`).join(''):'<div class="empty">No certificates yet.</div>'}catch(e){$('orders').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}load();</script></body></html>

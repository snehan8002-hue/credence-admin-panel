<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin — Courses</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 6%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:var(--g);letter-spacing:2px;font-size:24px}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--g);color:#fff;font-weight:800;cursor:pointer}.secondary{background:#e7f2ec;color:var(--g)}main{max-width:1200px;margin:auto;padding:32px 6%}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px}.head h1{margin:4px 0}.search{padding:11px;border:1px solid var(--line);border-radius:11px;width:280px}.course{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}.course-top{display:flex;justify-content:space-between;gap:15px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#e7f2ec;color:var(--g);font-size:12px;font-weight:800}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.editor{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;font-weight:800}.field input,.field textarea,.field select{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.field textarea{min-height:90px}.section{background:#f8fbf9;border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:12px}.lecture{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.hidden{display:none!important}.notice{padding:12px;background:#fff3cd;border-radius:10px;margin-bottom:15px}.error{color:#a33;background:#fff1f1;padding:12px;border-radius:10px;margin:10px 0}@media(max-width:650px){.head,.course-top{flex-direction:column;align-items:stretch}.search{width:100%}}</style></head><body><header><div><div class="brand">CREDENCE ADMIN</div><div class="muted">Course & content management</div></div><button id="refresh" class="btn secondary">Refresh</button></header><main><div id="notice" class="notice">Admin session required. This page uses your existing authenticated admin session.</div><div class="head"><div><div class="muted">CONTENT</div><h1>Courses</h1></div><div><input id="search" class="search" placeholder="Search courses…"><button id="newCourse" class="btn">+ New course</button></div></div><div id="editor" class="course hidden"></div><div id="list"><div class="muted">Loading courses…</div></div></main><script src="admin-courses.js"></script><script src="admin-courses-validation.js"></script></body></html>

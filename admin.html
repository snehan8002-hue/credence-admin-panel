<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin — Sign in</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,440px)}.brand{text-align:center;font-weight:950;color:var(--g);letter-spacing:3px;font-size:30px;margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 18px 50px #12312612}.hero{background:var(--g);color:#fff;border-radius:18px;padding:20px;margin-bottom:20px}.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:#e5f5ec;line-height:1.5}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:800}.field input{width:100%;padding:13px;border:1px solid #d5e1db;border-radius:11px;font:inherit}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:var(--g);color:#fff;font-weight:850;font-size:15px;cursor:pointer}.btn:disabled{opacity:.6}.secondary{background:#e7f2ec;color:var(--g);margin-top:9px}.msg{display:none;padding:11px 13px;border-radius:11px;margin:13px 0;font-size:13px;line-height:1.45}.error{background:#fff0f0;color:#a22}.success{background:#e9f7ef;color:#17623d}.links{text-align:center;margin-top:15px}.links a{color:var(--g);font-weight:800;text-decoration:none;font-size:13px}.hint{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin-top:15px}</style></head><body><main class="wrap"><div class="brand">CREDENCE ADMIN</div><section class="card"><div class="hero"><h1>Welcome back.</h1><p>Sign in with an authorized Admin or Master account.</p></div><div id="msg" class="msg error"></div><form id="form"><div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="email" required placeholder="Admin email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></div><button id="submit" class="btn" type="submit">Sign in</button></form><button id="forgot" class="btn secondary" type="button">Forgot password?</button><div class="hint">Admin registration is intentionally restricted. Students cannot create admin accounts.</div><div class="links"><a href="./index.html">← Back to CREDENCE Student app</a></div></section></main><script>const U='https://tasoycsbzceohgjxizdp.supabase.co',K='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',$=id=>document.getElementById(id);function msg(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'success':'error');$('msg').style.display='block'}async function auth(path,body){const r=await fetch(U+'/auth/v1/'+path,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error_description||d.msg||d.message||'Authentication failed');return d}async function profile(s){const r=await fetch(U+'/rest/v1/profiles?select=id,full_name,email,role,active,banned&id=eq.'+encodeURIComponent(s.user.id)+'&limit=1',{headers:{apikey:K,Authorization:'Bearer '+s.access_token}});const d=await r.json().catch(()=>[]);if(!r.ok)throw Error(d.message||'Could not verify admin access.');const p=d[0];if(!p||!['admin','master'].includes(String(p.role||'').toLowerCase())||p.active===false||p.banned===true)throw Error('This account does not have active admin access.');return p}async function existing(){try{const s=JSON.parse(localStorage.getItem('credence_session')||'null');if(!s?.access_token)return;await profile(s);location.replace('./'+(new URLSearchParams(location.search).get('return')||'admin-dashboard.html'))}catch{localStorage.removeItem('credence_session')}}existing();$('forgot').onclick=()=>location.href='./reset-password.html';$('form').onsubmit=async e=>{e.preventDefault();const b=$('submit');b.disabled=true;b.textContent='Signing in…';$('msg').style.display='none';try{const s=await auth('token?grant_type=password',{email:$('email').value.trim().toLowerCase(),password:$('password').value});await profile(s);localStorage.setItem('credence_session',JSON.stringify(s));location.replace('./'+(new URLSearchParams(location.search).get('return')||'admin-dashboard.html'))}catch(err){msg(/email not confirmed|email_not_confirmed/i.test(err.message)?'Please confirm this admin email before signing in.':err.message||'Admin sign-in failed.')}finally{b.disabled=false;b.textContent='Sign in'}};</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE — Videos & Live</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:950;color:var(--g);letter-spacing:2px;font-size:23px}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--g);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#e7f2ec;color:var(--g)}main{max-width:1100px;margin:auto;padding:30px 5%}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.tab.active{background:var(--g);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.video{width:100%;border-radius:13px;background:#111;max-height:260px}.live{border-left:5px solid #08783f}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#e7f2ec;color:var(--g);font-size:12px;font-weight:900}.muted{color:var(--muted)}.empty{padding:30px;background:#fff;border-radius:18px;color:var(--muted);grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">CREDENCE</div><div><a class="btn secondary" href="index.html">Home</a> <a class="btn secondary" href="student-courses.html">Courses</a></div></header><main><div class="tabs"><button class="tab active" data-kind="video">Videos</button><button class="tab" data-kind="live">Live classes</button><button class="tab" data-kind="photo">Photos</button></div><div id="grid" class="grid"><div class="empty">Loading…</div></div></main><script>const U='https://tasoycsbzceohgjxizdp.supabase.co',K='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',$=id=>document.getElementById(id);let mode='video',videos=[],lives=[],photos=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const h={apikey:K,Authorization:'Bearer '+(JSON.parse(localStorage.getItem('credence_session')||'{}').access_token||K)};const [a,b,c]=await Promise.all([fetch(U+'/rest/v1/content_items?select=id,title,description,video_url,file_path,duration_seconds,price_inr,tier&kind=eq.video&published=eq.true&order=created_at.desc',{headers:h}),fetch(U+'/rest/v1/live_streams?select=id,title,description,playback_url,scheduled_at,started_at,ended_at,is_live,price_inr,tier&order=scheduled_at.desc&limit=30',{headers:h}),fetch(U+'/rest/v1/content_items?select=id,title,description,file_path,video_url&kind=eq.note&published=eq.true&order=created_at.desc',{headers:h})]);videos=await a.json();lives=await b.json();photos=await c.json();render()}function render(){let html='';if(mode==='video')html=videos.length?videos.map(v=>`<article class="card"><span class="badge">VIDEO</span><h3>${esc(v.title)}</h3><p class="muted">${esc(v.description||'')}</p>${v.video_url?`<video class="video" controls playsinline src="${esc(v.video_url)}"></video>`:'<p class="muted">Video is available inside the course or is waiting for its media URL.</p>'}${Number(v.price_inr||0)>0?`<p><b>Paid • ₹${Number(v.price_inr).toLocaleString('en-IN')}</b></p>`:''}</article>`).join(''):'<div class="empty">No published videos yet.</div>';else if(mode==='live')html=lives.length?lives.map(v=>`<article class="card live"><span class="badge">${v.is_live?'LIVE NOW':'LIVE CLASS'}</span><h3>${esc(v.title)}</h3><p class="muted">${esc(v.description||'')}</p><p>${v.scheduled_at?'Scheduled: '+new Date(v.scheduled_at).toLocaleString('en-IN'):''}</p>${v.playback_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(v.playback_url)}">${v.is_live?'Join live':'Open stream'}</a>`:'<span class="muted">Stream link not published yet.</span>'}</article>`).join(''):'<div class="empty">No live classes yet.</div>';else html=photos.length?photos.map(v=>`<article class="card"><span class="badge">PHOTO</span><h3>${esc(v.title)}</h3><p class="muted">${esc(v.description||'')}</p>${v.video_url?`<img src="${esc(v.video_url)}" alt="${esc(v.title)}" style="width:100%;border-radius:13px;max-height:300px;object-fit:cover">`:v.file_path?`<p class="muted">Photo path: ${esc(v.file_path)}</p>`:'<p class="muted">Photo media is not attached yet.</p>'}</article>`).join(''):'<div class="empty">No published photos yet.</div>';$('grid').innerHTML=html}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.kind;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});load().catch(()=>{$('grid').innerHTML='<div class="empty">Media could not be loaded.</div>'});</script></body></html>

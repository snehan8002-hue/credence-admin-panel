<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE — Reset Password</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,540px)}.welcome{text-align:center;margin-bottom:18px}.brand{font-weight:950;letter-spacing:3px;color:var(--g);font-size:30px}.tag{margin-top:6px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 18px 50px #12312612}.hero{background:var(--g);color:#fff;border-radius:20px;padding:22px;margin-bottom:22px}.hero h1{margin:0 0 7px;font-size:27px}.hero p{margin:0;line-height:1.5;color:#e5f5ec}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:13px;font-weight:800}.field input{width:100%;padding:14px;border:1px solid #d5e1db;border-radius:12px;font:inherit;font-size:16px}.field input:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px #08783f18}button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:850;font-size:16px;cursor:pointer}button:disabled{opacity:.6}.msg{display:none;padding:12px;border-radius:11px;margin:14px 0;font-size:14px;line-height:1.45}.error{background:#fff0f0;color:#a22}.success{background:#e9f7ef;color:#17623d}.hint{text-align:center;color:var(--muted);font-size:13px;line-height:1.5;margin:16px 0 0}.back{display:block;text-align:center;color:var(--g);font-weight:800;text-decoration:none;margin-top:18px}</style></head><body><main class="wrap"><div class="welcome"><div class="brand">CREDENCE</div><div class="tag">Student Learning</div></div><section class="card"><div class="hero"><h1>Reset your password.</h1><p>Set a new password securely and continue learning.</p></div><div id="error" class="msg error"></div><div id="success" class="msg success"></div><section id="requestBox"><form id="requestForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><button id="requestBtn" type="submit">Send reset email</button></form><p class="hint">We will send a secure password-reset link to your email. Check Spam or Promotions if it does not appear.</p></section><section id="changeBox" hidden><form id="changeForm"><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required></div><div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Enter it again" required></div><button id="changeBtn" type="submit">Set new password</button></form></section><a class="back" href="./index.html">← Back to CREDENCE</a></section></main><script>const URL='https://tasoycsbzceohgjxizdp.supabase.co',KEY='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',REDIRECT=new URL('./student-reset-password.html',window.location.href).href;const $=id=>document.getElementById(id);let recoveryToken='';function msg(id,text){$('error').style.display='none';$('success').style.display='none';$(id).textContent=text;$(id).style.display='block'}function readRecovery(){const hash=new URLSearchParams(location.hash.replace(/^#/,''));const query=new URLSearchParams(location.search);const err=query.get('error_description')||hash.get('error_description');if(err){msg('error',decodeURIComponent(err.replace(/\+/g,' ')));return}const access=hash.get('access_token'),refresh=hash.get('refresh_token');if(access&&refresh){recoveryToken=access;$('requestBox').hidden=true;$('changeBox').hidden=false;history.replaceState(null,document.title,location.pathname)}}readRecovery();$('requestForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('requestBtn');b.disabled=true;b.textContent='Sending…';try{const email=$('email').value.trim().toLowerCase();const r=await fetch(URL+'/auth/v1/recover',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,redirect_to:REDIRECT})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error_description||d.msg||d.message||'Could not send the reset email.');msg('success','If this email belongs to a CREDENCE account, the reset email has been sent. Check Inbox and Spam.')}catch(err){msg('error',err.message||'Password reset failed.')}finally{b.disabled=false;b.textContent='Send reset email'}});$('changeForm').addEventListener('submit',async e=>{e.preventDefault();const p=$('password').value,c=$('confirm').value;if(p!==c)return msg('error','The passwords do not match.');if(p.length<8)return msg('error','Password must be at least 8 characters.');if(!recoveryToken)return msg('error','This reset link is missing or expired. Request a new reset email.');const b=$('changeBtn');b.disabled=true;b.textContent='Updating…';try{const r=await fetch(URL+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+recoveryToken,'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error_description||d.msg||d.message||'Could not update the password.');msg('success','Password changed successfully. You can now sign in with your new password.');$('changeBox').hidden=true;setTimeout(()=>location.replace('./index.html'),1400)}catch(err){msg('error',err.message||'Password update failed.')}finally{b.disabled=false;b.textContent='Set new password'}});</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE — Courses</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:950;color:var(--g);letter-spacing:2px;font-size:23px}.btn,button{border:0;border-radius:11px;padding:10px 14px;background:var(--g);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#e7f2ec;color:var(--g)}main{max-width:1100px;margin:auto;padding:30px 5%}.head{display:flex;justify-content:space-between;gap:15px;align-items:end}.muted{color:var(--muted)}.search{padding:12px;border:1px solid #d5e1db;border-radius:11px;width:280px;max-width:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.thumb{height:150px;background:#e1f3e9;display:grid;place-items:center;color:var(--g);font-weight:900}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:18px}.price{font-size:20px;font-weight:900;color:var(--g)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.empty{padding:30px;background:#fff;border-radius:18px;color:var(--muted);grid-column:1/-1}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.head{align-items:stretch;flex-direction:column}.search{width:100%}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">CREDENCE</div><div><a class="btn secondary" href="index.html">Home</a> <a class="btn secondary" href="student-videos.html">Videos</a></div></header><main><div class="head"><div><div class="muted">LEARNING</div><h1>Courses</h1><p class="muted">Browse free and paid courses. Your purchased courses stay available in My Learning.</p></div><input id="search" class="search" placeholder="Search courses…"></div><div id="grid" class="grid"><div class="empty">Loading courses…</div></div></main><script>const U='https://tasoycsbzceohgjxizdp.supabase.co',K='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',$=id=>document.getElementById(id);let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch(U+'/rest/v1/courses?select=id,title,description,thumbnail_path,price_inr,tier,published&published=eq.true&order=created_at.desc',{headers:{apikey:K}});rows=await r.json();render()}function render(){const q=$('search').value.toLowerCase();const a=rows.filter(x=>`${x.title} ${x.description||''}`.toLowerCase().includes(q));$('grid').innerHTML=a.length?a.map(c=>`<article class="card"><div class="thumb">${c.thumbnail_path?`<img src="${esc(c.thumbnail_path)}" alt="">`:'CREDENCE'}</div><div class="body"><h3>${esc(c.title)}</h3><p class="muted">${esc(c.description||'')}</p><div class="price">${Number(c.price_inr||0)>0?'₹'+Number(c.price_inr).toLocaleString('en-IN'):'Free'}</div><div class="actions"><a class="btn" href="index.html#courses">Open / Buy</a></div></div></article>`).join(''):'<div class="empty">No courses found.</div>'}$('search').oninput=render;load().catch(()=>$('grid').innerHTML='<div class="empty">Courses could not be loaded.</div>');</script></body></html>

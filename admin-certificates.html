<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin — Certificates</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}.brand{font-weight:950;letter-spacing:2px;color:var(--g);font-size:24px}.wrap{max-width:1200px;margin:auto;padding:30px 5%}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}.pill{display:inline-block;background:#e1f3e9;color:var(--g);padding:6px 11px;border-radius:99px;font-weight:800;font-size:12px}.tools{display:flex;gap:8px;flex-wrap:wrap}.search,.filter{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.search{width:min(420px,100%)}.filter{min-width:150px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{font-size:25px}.stat small{display:block;color:var(--muted);margin-top:3px}.table-wrap{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:15px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);background:#f8fbf9}tr:last-child td{border-bottom:0}.id{font:700 12px ui-monospace,monospace;word-break:break-all}.status{font-weight:800}.valid{color:var(--g)}.revoked{color:#a23a2a}.btn,button{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.danger{background:#f9e4df;color:#922d20}.secondary{background:#e7f2ec;color:var(--g)}.empty{padding:35px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:20}.modal[hidden]{display:none}.box{background:#fff;border-radius:20px;padding:25px;max-width:600px;width:100%;max-height:90vh;overflow:auto}.close{float:right;background:#edf3ef;color:var(--ink)}.detail{display:grid;gap:10px;margin-top:20px}.detail div{padding:12px;background:#f6faf7;border-radius:10px}.notice{padding:12px;border-radius:10px;background:#fff3cd;color:#705b12;margin-top:15px}@media(max-width:650px){.wrap{padding:24px 4%}.top{align-items:stretch;flex-direction:column}.stats{grid-template-columns:1fr}.tools{width:100%}.search,.filter{width:100%}}</style></head><body><header><div class="brand">CREDENCE ADMIN</div><a class="btn secondary" href="index.html">Student app</a></header><main class="wrap"><div class="top"><div><span class="pill">CERTIFICATE MANAGEMENT</span><h1>Certificates</h1><p style="color:var(--muted)">Search, inspect, verify, revoke and restore completion certificates.</p></div><div class="tools"><input id="search" class="search" placeholder="Search certificate ID, student or course…"><select id="statusFilter" class="filter"><option value="all">All statuses</option><option value="valid">Valid</option><option value="revoked">Revoked</option></select></div></div><div class="stats"><div class="stat"><b id="totalCount">0</b><small>Total certificates</small></div><div class="stat"><b id="validCount">0</b><small>Valid certificates</small></div><div class="stat"><b id="revokedCount">0</b><small>Revoked certificates</small></div></div><div id="notice"></div><div class="table-wrap"><div id="loading" class="empty">Checking administrator access…</div><table id="certTable" hidden><thead><tr><th>Certificate</th><th>Student</th><th>Course</th><th>Issued</th><th>Status</th><th>Actions</th></tr></thead><tbody id="certBody"></tbody></table></div></main><div id="modal" class="modal" hidden><div class="box"><button id="close" class="close">✕</button><h2>Certificate details</h2><div id="detail" class="detail"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><button id="verifyBtn" class="secondary">Verify publicly</button><button id="revokeBtn" class="danger">Revoke certificate</button><button id="restoreBtn" class="secondary" hidden>Restore certificate</button></div></div></div><script src="admin-certificates.js"></script></body></html>

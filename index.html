<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin — Control Center</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,440px)}.brand{text-align:center;font-weight:950;color:var(--g);letter-spacing:2px;font-size:28px}.sub{text-align:center;color:var(--muted);margin:6px 0 24px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 10px 30px #1231260d}h1{margin:0 0 8px;font-size:26px}.hint{color:var(--muted);font-size:14px;line-height:1.5}.field{display:grid;gap:6px;margin:16px 0}.field label{font-size:13px;font-weight:800}.field input{width:100%;padding:13px;border:1px solid #d5e1db;border-radius:11px;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:13px 16px;background:var(--g);color:#fff;font-weight:900;cursor:pointer;font-size:14px}.btn:disabled{opacity:.65;cursor:wait}.error{padding:12px 14px;border-radius:11px;background:#fff3f3;color:#a33;font-size:13px;margin:14px 0}.ok{padding:12px 14px;border-radius:11px;background:#e7f2ec;color:var(--g);font-size:13px;margin:14px 0}</style></head><body><div class="wrap"><div class="brand">CREDENCE ADMIN</div><div class="sub">Control Center</div><div class="card"><h1>Admin Login</h1><div class="hint">Sign in with your existing CREDENCE admin email and password. No OTP is required for this Admin Panel.</div><div id="msg"></div><form id="form"><div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></div><button id="submit" class="btn" type="submit">Login to Control Center</button></form></div></div><script>const URL='https://tasoycsbzceohgjxizdp.supabase.co',KEY='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',msg=document.querySelector('#msg'),form=document.querySelector('#form'),submit=document.querySelector('#submit');function show(t,c='error'){msg.innerHTML='<div class="'+c+'">'+t+'</div>'}async function login(email,password){const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error_description||d.msg||d.message||'Login failed');return d}async function verifyAdmin(s){const r=await fetch(URL+'/rest/v1/profiles?select=id,email,full_name,role,active,banned&id=eq.'+encodeURIComponent(s.user.id)+'&limit=1',{headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}});const p=(await r.json().catch(()=>[]))[0];if(!r.ok||!p)throw Error('This account has no CREDENCE profile.');if(!['admin','master'].includes(String(p.role||'').toLowerCase())||p.active===false||p.banned===true)throw Error('This account is not an active CREDENCE admin/master account.');return p}try{const s=JSON.parse(localStorage.getItem('credence_session')||'null');if(s?.access_token&&s?.user)location.replace('admin-dashboard.html')}catch{}form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;msg.innerHTML='';try{const s=await login(email.value.trim(),password.value);await verifyAdmin(s);localStorage.setItem('credence_session',JSON.stringify(s));show('Login successful. Opening Control Center…','ok');setTimeout(()=>location.replace('admin-dashboard.html'),250)}catch(e){show(e.message||'Login failed')}finally{submit.disabled=false}})</script></body></html>

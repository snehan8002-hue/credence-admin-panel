<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin Support</title><style>body{font-family:system-ui;margin:0;background:#f5f8f6;color:#123126}header{background:#08783f;color:#fff;padding:18px 6%;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:25px 6%}.bar{display:flex;gap:10px;flex-wrap:wrap}.bar input,.bar select,textarea{padding:11px;border:1px solid #d5e1db;border-radius:10px;font:inherit}.bar input{flex:1;min-width:220px}.ticket{background:#fff;border:1px solid #e2ebe6;border-radius:16px;padding:18px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px}.status{padding:5px 9px;border-radius:99px;background:#e7f2ec;color:#08783f;font-size:12px;font-weight:800}.msg{padding:9px;background:#f4f8f5;border-radius:9px;margin:6px 0}.reply{display:flex;gap:8px;margin-top:10px}.reply input{flex:1;padding:10px;border:1px solid #d5e1db;border-radius:10px}button{border:0;background:#08783f;color:#fff;padding:10px 14px;border-radius:10px;font-weight:700}@media(max-width:650px){.row{flex-direction:column}.reply{flex-direction:column}}</style></head><body><header>CREDENCE ADMIN • SUPPORT</header><main class="wrap"><div class="bar"><input id="search" placeholder="Search subject, student ID or ticket ID"><select id="status"><option value="">All statuses</option><option>open</option><option>in_progress</option><option>resolved</option><option>closed</option></select><button id="refresh">Refresh</button></div><div id="list">Loading…</div></main><script src="admin-support.js"></script></body></html>

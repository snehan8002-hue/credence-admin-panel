name: Publish CREDENCE Admin Panel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[sync-admin]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preserve Admin Control Center entry page
        run: cp index.html /tmp/credence-admin-index.html
      - name: Copy complete CREDENCE app and Admin Panel
        run: |
          git clone --depth 1 --branch credence-admin-publish https://github.com/snehan8002-hue/credence-admin.git source
          rm -rf source/.git source/README.md
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name source -exec rm -rf {} +
          cp -R source/. .
          rm -rf source
          cp /tmp/credence-admin-index.html index.html
          test -f index.html
          test -f app.js
          test -f notifications.js
          test -f profile.html
          test -f student-courses.html
          test -f student-videos.html
          test -f student-quizzes.html
          test -f student-tests.html
          test -f student-fees.html
          test -f student-reset-password.html
          test -f admin-media.html
          test -f reset-password.html
          touch .nojekyll
          echo "Verified complete student app, auth, section pages, media and admin files"
      - name: Commit synced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No file changes"; else git commit -m "Sync complete CREDENCE app and Admin Panel [sync-admin]"; git push; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

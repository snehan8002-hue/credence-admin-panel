name: Publish CREDENCE Admin Panel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[sync-admin]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copy finished Admin Panel
        run: |
          git clone --depth 1 --branch credence-admin-publish https://github.com/snehan8002-hue/credence-admin.git source
          rm -rf source/.git source/README.md
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name source -exec rm -rf {} +
          cp -R source/. .
          rm -rf source
          cat > index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=admin-dashboard.html"><title>CREDENCE Admin</title><script>location.replace('admin-dashboard.html');</script></head><body><p>Opening CREDENCE Admin… <a href="admin-dashboard.html">Continue</a></p></body></html>
          EOF
          rm -f admin.html admin.js app.js app-auth-fix.js auth-bridge.js certificates.js checkout.js learning.js notifications.js orders.js profile-settings.js profile.html quiz.html quiz.js smoke-test.html support.html support.js
      - name: Commit synced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No file changes"; else git commit -m "Sync finished CREDENCE Admin Panel [sync-admin]"; git push; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        uses: actions/deploy-pages@v4

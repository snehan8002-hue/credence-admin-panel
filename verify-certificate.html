<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CREDENCE — Verify Certificate</title>
<style>
:root{--g:#08783f;--bg:#f3f8f5;--ink:#173326;--muted:#66786f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 18px 55px #17332618}.brand{font-weight:900;letter-spacing:5px;color:var(--g);font-size:25px}.eyebrow{margin-top:30px;font-size:12px;font-weight:800;letter-spacing:2px;color:var(--muted)}h1{margin:8px 0 10px;font-size:32px}p{color:var(--muted);line-height:1.6}.form{display:flex;gap:10px;margin-top:24px}.form input{flex:1;padding:14px 15px;border:1px solid #d6e2db;border-radius:11px;font:inherit;outline:none}.form input:focus{border-color:var(--g)}button{padding:14px 20px;border:0;border-radius:11px;background:var(--g);color:#fff;font-weight:800;cursor:pointer}.result{margin-top:22px;border-radius:15px;padding:20px;display:none}.ok{background:#eef9f2;border:1px solid #bfe2ca}.bad{background:#fff4f2;border:1px solid #f0c7bf}.status{font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.value{font-weight:750;margin-top:4px;word-break:break-word}.verify{margin-top:18px;font-size:12px;color:var(--muted)}@media(max-width:560px){.card{padding:25px}.form{flex-direction:column}.grid{grid-template-columns:1fr}h1{font-size:27px}}
</style></head>
<body><main class="card"><div class="brand">CREDENCE</div><div class="eyebrow">PUBLIC VERIFICATION</div><h1>Verify a certificate</h1><p>Enter the certificate ID to confirm whether a CREDENCE completion certificate is authentic and currently valid.</p><form class="form" id="form"><input id="id" autocomplete="off" placeholder="e.g. CRED-ABC123" maxlength="100" required><button id="btn">Verify</button></form><section id="result" class="result"></section><div class="verify">Verification is provided directly by CREDENCE.</div></main><script src="verify-certificate.js"></script></body></html>

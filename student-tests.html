<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE — Tests</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:var(--g);letter-spacing:2px;font-size:23px}.btn,button{border:0;border-radius:11px;padding:10px 14px;background:var(--g);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#e7f2ec;color:var(--g)}main{max-width:1000px;margin:auto;padding:30px 5%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.muted{color:var(--muted)}.option{display:block;width:100%;text-align:left;background:#f5f8f6;color:var(--ink);margin:8px 0;border:1px solid var(--line)}.option.selected{background:#e1f3e9;border-color:#08783f}.empty{padding:30px;background:#fff;border-radius:18px;color:var(--muted);grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">CREDENCE</div><div><a class="btn secondary" href="index.html">Home</a> <a class="btn secondary" href="student-quizzes.html">Quizzes</a></div></header><main><div id="app"><div class="empty">Loading tests…</div></div></main><script>const U='https://tasoycsbzceohgjxizdp.supabase.co',K='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',$=id=>document.getElementById(id);let tests=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tok(){try{return JSON.parse(localStorage.getItem('credence_session')||'null')?.access_token||''}catch{return ''}}async function api(p,o={}){const r=await fetch(U+'/rest/v1/'+p,{...o,headers:{apikey:K,Authorization:'Bearer '+(tok()||K),'Content-Type':'application/json',...(o.headers||{})}});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'Request failed');return d}async function load(){tests=await api('content_items?select=id,title,description,course_id,price_inr,tier&kind=eq.test&published=eq.true&order=created_at.desc');render()}function render(){$('app').innerHTML=`<h1>Tests</h1><p class="muted">Attempt published tests when you have access to the course or content.</p><div class="grid">${tests.length?tests.map(t=>`<article class="card"><h3>${esc(t.title)}</h3><p class="muted">${esc(t.description||'')}</p><p>${Number(t.price_inr||0)>0?'Paid content':'Available'}</p><button data-start="${t.id}">Start test</button></article>`).join(''):'<div class="empty">No published tests available.</div>'}</div>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start))}async function start(id){$('app').innerHTML='<div class="panel">Loading test…</div>';try{const t=tests.find(x=>x.id===id);const qs=await api('test_questions?content_id=eq.'+id+'&select=id,question_text,options,correct_option,marks,negative_marks,sort_order&order=sort_order.asc');if(!qs.length)throw Error('This test has no questions yet.');$('app').innerHTML=`<div class="panel"><button id="back" class="secondary">← Tests</button><h1>${esc(t.title)}</h1><div id="questions"></div><button id="submit">Submit test</button></div>`;const answers={};qs.forEach((q,i)=>{let opts=q.options;try{if(typeof opts==='string')opts=JSON.parse(opts)}catch{}opts=Array.isArray(opts)?opts:[];const box=document.createElement('div');box.className='card';box.style.margin='14px 0';box.innerHTML=`<b>${i+1}. ${esc(q.question_text)}</b><div>${opts.map((o,j)=>`<button type="button" class="option" data-q="${q.id}" data-o="${j}">${esc(typeof o==='string'?o:o?.text??o?.label??'Option')}</button>`).join('')}</div>`;$('questions').appendChild(box)});document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{document.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');answers[b.dataset.q]=Number(b.dataset.o)});$('back').onclick=render;$('submit').onclick=async()=>{try{let score=0,total=0;qs.forEach(q=>{total+=Number(q.marks||0);const a=answers[q.id];if(a!==undefined){if(a===Number(q.correct_option))score+=Number(q.marks||0);else score-=Number(q.negative_marks||0)}});const s=await api('test_attempts',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({content_id:id,student_id:JSON.parse(localStorage.getItem('credence_session')||'{}').user?.id,started_at:new Date().toISOString(),submitted_at:new Date().toISOString(),score,total_marks:total,answers,time_spent_seconds:0})});$('app').innerHTML=`<div class="panel"><h1>Test submitted 🎉</h1><p>Score: <b>${score}</b> / ${total}</p><button id="again">Back to tests</button></div>`;$('again').onclick=render}catch(e){alert(e.message)}}}catch(e){$('app').innerHTML=`<div class="panel"><b>${esc(e.message)}</b><p class="muted">Log in first and make sure you have access to this test.</p></div>`}}load().catch(e=>$('app').innerHTML='<div class="panel"><b>'+esc(e.message)+'</b></div>');</script></body></html>

<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Auth Test</title><style>body{font-family:system-ui;max-width:600px;margin:40px auto;padding:20px}input,button{padding:12px;margin:6px 0;width:100%;box-sizing:border-box}button{background:#08783f;color:white;border:0;border-radius:8px}.ok{color:#08783f}.bad{color:#a33}</style><h1>CREDENCE Auth Test</h1><p>Use the same CREDENCE email and password. This page only tests login/session.</p><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password"><button id="b">Test Login</button><pre id="o">Waiting…</pre><script src="app-auth-fix.js"></script><script>const o=document.querySelector('#o');b.onclick=async()=>{b.disabled=true;o.textContent='Testing…';try{const s=await CREDENCE_AUTH.login(e.value.trim(),p.value);const u=await fetch('https://tasoycsbzceohgjxizdp.supabase.co/rest/v1/profiles?select=id,email,role,active,banned&id=eq.'+encodeURIComponent(s.user.id),{headers:{apikey:'sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',Authorization:'Bearer '+s.access_token}});const p=await u.json();o.className='ok';o.textContent='LOGIN OK\nSession saved: yes\nProfile: '+JSON.stringify(p,null,2)+'\n\nNow open Admin.'}catch(x){o.className='bad';o.textContent=x.message}finally{b.disabled=false}}</script>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin — Reset Password</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:Georgia,serif;color:var(--ink);padding:24px}.card{width:min(100%,520px);background:#fff;border:1px solid var(--line);border-radius:28px;padding:42px;box-shadow:0 18px 50px #12312612;text-align:center}.logo{font-size:50px}.brand{font-size:34px;font-weight:900;letter-spacing:1.5px}.sub{font-size:19px;color:var(--muted);margin:8px 0 28px}.field{text-align:left;margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #d5e1db;border-radius:12px;font:inherit;font-size:16px}button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--g);color:#fff;font:700 17px Georgia,serif;cursor:pointer;margin-top:8px}button:disabled{opacity:.65}.link{display:block;margin-top:16px;color:var(--g);font:700 14px system-ui,sans-serif;text-decoration:none}.msg{display:none;padding:12px;border-radius:11px;margin:14px 0;font:14px system-ui,sans-serif}.error{background:#fff0f0;color:#a33}.success{background:#e9f7ef;color:#17623d}.hint{color:var(--muted);font:14px system-ui,sans-serif;line-height:1.5;margin-top:20px}@media(max-width:520px){.card{padding:30px 22px}.brand{font-size:29px}}</style></head><body><main class="card"><div class="logo">🔐</div><div class="brand">CREDENCE Admin</div><div class="sub">Reset your admin password</div><div id="error" class="msg error"></div><div id="success" class="msg success"></div><section id="requestBox"><form id="requestForm"><div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="email" required placeholder="Admin email"></div><button id="send" type="submit">Send reset link</button></form><div class="hint">A password-reset link will be sent to the email address. No OTP is used.</div></section><section id="changeBox" hidden><form id="changeForm"><div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"></div><div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="6" required placeholder="Enter it again"></div><button id="update" type="submit">Set new password</button></form></section><a class="link" href="index.html">← Back to Admin Login</a></main><script>const URL='https://tasoycsbzceohgjxizdp.supabase.co',KEY='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl';const $=s=>document.querySelector(s);function msg(id,text){$('#error').style.display='none';$('#success').style.display='none';const e=$(id);e.textContent=text;e.style.display='block'}function tokenFromHash(){const p=new URLSearchParams(location.hash.replace(/^#/,''));return p.get('access_token')}async function profileAllowed(token){const r=await fetch(`${URL}/auth/v1/user`,{headers:{apikey:KEY,Authorization:`Bearer ${token}`}});if(!r.ok)throw Error('The reset link is invalid or expired.');const u=await r.json();const q=await fetch(`${URL}/rest/v1/profiles?select=role,active,banned&id=eq.${encodeURIComponent(u.id)}&limit=1`,{headers:{apikey:KEY,Authorization:`Bearer ${token}`}});const p=(await q.json().catch(()=>[]))[0];const role=String(p?.role||'').toLowerCase();if(!q.ok||!p||!['admin','master'].includes(role)||p.active===false||p.banned===true)throw Error('This account is not an active CREDENCE Admin/Master account.');return u}async function init(){const token=tokenFromHash();if(!token)return;try{await profileAllowed(token);$('#requestBox').hidden=true;$('#changeBox').hidden=false;history.replaceState(null,document.title,location.pathname+location.search+location.hash)}catch(e){msg('#error',e.message)}}init();$('#requestForm').addEventListener('submit',async e=>{e.preventDefault();$('#send').disabled=true;$('#send').textContent='Sending…';try{const email=$('#email').value.trim().toLowerCase();const redirect=`${location.origin}${location.pathname}`;const r=await fetch(`${URL}/auth/v1/recover`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,redirect_to:redirect})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error_description||d.msg||'Could not send the reset link.');msg('#success','If this email belongs to an authorized Admin/Master account, a password reset link has been sent. Check your inbox and Spam folder.')}catch(e){msg('#error',e.message)}finally{$('#send').disabled=false;$('#send').textContent='Send reset link'}});$('#changeForm').addEventListener('submit',async e=>{e.preventDefault();const a=$('#password').value,b=$('#confirm').value;if(a!==b){msg('#error','The passwords do not match.');return}const token=tokenFromHash();if(!token){msg('#error','The reset session is missing. Request a new reset link.');return}$('#update').disabled=true;$('#update').textContent='Updating…';try{const r=await fetch(`${URL}/auth/v1/user`,{method:'PUT',headers:{apikey:KEY,Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({password:a})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.message||'Could not update the password.');msg('#success','Admin password changed successfully. You can now sign in with the new password.');$('#changeBox').hidden=true;setTimeout(()=>location.replace('index.html'),1200)}catch(e){msg('#error',e.message)}finally{$('#update').disabled=false;$('#update').textContent='Set new password'}});</script></body></html>

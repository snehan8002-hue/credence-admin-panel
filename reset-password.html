<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CREDENCE Admin — Reset Password</title>
<style>
:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--ink);padding:20px}
.card{width:min(100%,520px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 18px 50px #12312612}
.logo{text-align:center;font-size:48px}.brand{text-align:center;font:900 30px Georgia,serif;letter-spacing:1.5px}.sub{text-align:center;color:var(--muted);margin:7px 0 26px}
.field{margin:16px 0}.field label{display:block;font-weight:750;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #d5e1db;border-radius:12px;font:inherit;font-size:16px;outline:none}.field input:focus{border-color:var(--g);box-shadow:0 0 0 3px #08783f18}
button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:800;font-size:17px;cursor:pointer}button:disabled{opacity:.6}.link{display:block;text-align:center;margin-top:16px;color:var(--g);font-weight:750;text-decoration:none}
.msg{display:none;padding:12px;border-radius:11px;margin:14px 0;font-size:14px}.error{background:#fff0f0;color:#a22}.success{background:#e9f7ef;color:#17623d}.hint{font-size:13px;color:var(--muted);line-height:1.5;margin-top:14px}
</style>
</head>
<body>
<main class="card">
<div class="logo">🔐</div><div class="brand">CREDENCE Admin</div><div class="sub">Reset your Control Center password</div>
<div id="error" class="msg error"></div><div id="success" class="msg success"></div>
<section id="requestBox">
<form id="requestForm"><div class="field"><label for="email">Admin Email</label><input id="email" type="email" autocomplete="email" placeholder="Admin email" required></div><button id="requestBtn" type="submit">Send reset link</button></form>
<p class="hint">Enter the email of an existing authorized Admin or Master account. The reset link will be sent to that email.</p>
</section>
<section id="changeBox" hidden>
<form id="changeForm"><div class="field"><label for="password">New Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required></div><div class="field"><label for="confirm">Confirm New Password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Enter it again" required></div><button id="changeBtn" type="submit">Set New Password</button></form>
</section>
<a class="link" href="./index.html">← Back to Admin Login</a>
</main>
<script>
const URL='https://tasoycsbzceohgjxizdp.supabase.co',KEY='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl';const $=id=>document.getElementById(id);let recoveryToken='';
function msg(id,text){$('error').style.display='none';$('success').style.display='none';$(id).textContent=text;$(id).style.display='block'}
const token=new URLSearchParams(location.hash.replace(/^#/,'')).get('access_token');if(token){recoveryToken=token;$('requestBox').hidden=true;$('changeBox').hidden=false;history.replaceState(null,'',location.pathname)}
$('requestForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('requestBtn');b.disabled=true;b.textContent='Sending…';try{const email=$('email').value.trim().toLowerCase();const redirect=location.origin+location.pathname.replace(/reset-password\.html.*$/,'')+'reset-password.html';const r=await fetch(URL+'/auth/v1/recover',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,redirect_to:redirect})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.message||'Could not send the reset email.');msg('success','If this email belongs to an authorized account, a password reset link has been sent. Check the inbox and spam folder.')}catch(err){msg('error',err.message||'Password reset failed.')}finally{b.disabled=false;b.textContent='Send reset link'}});
$('changeForm').addEventListener('submit',async e=>{e.preventDefault();const p=$('password').value,c=$('confirm').value;if(p.length<8)return msg('error','Password must be at least 8 characters.');if(p!==c)return msg('error','The passwords do not match.');if(!recoveryToken)return msg('error','This reset link is missing or expired. Request a new reset link.');const b=$('changeBtn');b.disabled=true;b.textContent='Updating…';try{const r=await fetch(URL+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+recoveryToken,'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.message||'Could not update the password.');msg('success','Password changed successfully. You can now sign in with the new password.');$('changeBox').hidden=true;setTimeout(()=>location.replace('./index.html'),1200)}catch(err){msg('error',err.message||'Password update failed.')}finally{b.disabled=false;b.textContent='Set New Password'}});
</script>
</body>
</html>
